name: CI

on:
  push:
    branches: [master, main, 'trae/**']
  pull_request:
    branches: [master, main]

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm test --workspaces --if-present
        env:
          MONGODB_URI: mongodb://localhost:27017/klinikly_test
          JWT_ACCESS_SECRET: ci-access-secret-32chars-minimum
          JWT_REFRESH_SECRET: ci-refresh-secret-32chars-minimum

      - name: Build web
        run: npm run build:web
        env:
          VITE_API_URL: http://localhost:3001

      - name: Build admin
        run: npm run build:admin
        env:
          VITE_API_URL: http://localhost:3001

      - name: Build API
        run: npm run build:api

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klinikly-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
