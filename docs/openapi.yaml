openapi: 3.1.0
info:
  title: Klinikly API
  version: 1.0.0
  description: Multi-tenant hospital booking API. All responses use an envelope with `data` or `error`.
servers:
  - url: https://klinikly-api.onrender.com
  - url: http://localhost:3001
tags:
  - name: Health
  - name: Auth
  - name: Public
  - name: Patient
  - name: Admin
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      responses:
        "200":
          description: Process is running
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe with database check
      responses:
        "200":
          description: Database is reachable
        "503":
          description: Database is not reachable
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Account created
        "400":
          description: Validation error
        "409":
          description: Email already exists
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access token and refresh cookie
        "401":
          description: Invalid credentials
        "429":
          description: Rate limited
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token
      responses:
        "200":
          description: New access token and rotated refresh cookie
        "401":
          description: Missing, revoked, or reused refresh token
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the refresh token
      responses:
        "200":
          description: Session revoked
  /hospitals:
    get:
      tags: [Public]
      summary: List active hospitals
      responses:
        "200":
          description: Hospitals
  /doctors:
    get:
      tags: [Public]
      summary: Search the doctor directory
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: specialty
          in: query
          schema: { type: string }
        - name: hospitalId
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: Paginated doctors
  /doctors/{doctorId}:
    get:
      tags: [Public]
      summary: Get a doctor profile
      parameters:
        - $ref: "#/components/parameters/DoctorId"
      responses:
        "200":
          description: Doctor
        "404":
          description: Not found
  /doctors/{doctorId}/availability:
    get:
      tags: [Public]
      summary: Get future availability for a doctor
      parameters:
        - $ref: "#/components/parameters/DoctorId"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Available slots
  /appointments:
    post:
      tags: [Patient]
      summary: Book the next available slot
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
      responses:
        "200":
          description: Appointment created
        "400":
          description: Invalid or past slot
        "409":
          description: Slot already claimed
  /appointments/{appointmentId}/cancel:
    post:
      tags: [Patient]
      summary: Cancel a patient's appointment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancelled and slot released
        "404":
          description: Not found for this patient
        "409":
          description: Not cancellable
  /me:
    get:
      tags: [Patient]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: User
  /me/appointments:
    get:
      tags: [Patient]
      summary: Current patient's appointments
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Appointment history
  /admin/appointments:
    get:
      tags: [Admin]
      summary: List appointments for the authenticated hospital
      security: [{ bearerAuth: [] }]
      parameters:
        - name: doctorId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Hospital-scoped appointments
        "403":
          description: Not a hospital administrator
  /admin/appointments/{appointmentId}/cancel:
    post:
      tags: [Admin]
      summary: Cancel an appointment in this hospital
      security: [{ bearerAuth: [] }]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancelled
        "409":
          description: Not cancellable
  /admin/appointments/{appointmentId}/complete:
    post:
      tags: [Admin]
      summary: Mark an appointment complete
      security: [{ bearerAuth: [] }]
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Completed
        "409":
          description: Not completable
  /admin/audit:
    get:
      tags: [Admin]
      summary: Read the hospital's append-only audit trail
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Audit entries
        "403":
          description: Not a hospital administrator
  /admin/hospital:
    get:
      tags: [Admin]
      summary: Get the authenticated hospital
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Hospital
  /admin/doctors:
    get:
      tags: [Admin]
      summary: List doctors for this hospital
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Doctors
    post:
      tags: [Admin]
      summary: Create a doctor
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, specialty, bio, consultationFee]
              properties:
                name: { type: string }
                specialty: { type: string }
                bio: { type: string }
                consultationFee: { type: number }
                rating: { type: number }
      responses:
        "200":
          description: Created
        "400":
          description: Validation error
  /admin/doctors/{doctorId}/availability-rules:
    put:
      tags: [Admin]
      summary: Replace weekly availability rules
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DoctorId"
      responses:
        "200":
          description: Rules saved
        "404":
          description: Doctor not in this hospital
  /admin/doctors/{doctorId}/slots/generate:
    post:
      tags: [Admin]
      summary: Generate slots from weekly rules
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DoctorId"
      responses:
        "200":
          description: Generation summary
  /admin/doctors/{doctorId}/slots:
    get:
      tags: [Admin]
      summary: List slots in a date range
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DoctorId"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Slots
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DoctorId:
      name: doctorId
      in: path
      required: true
      schema: { type: string }
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        name: { type: string }
        phone: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    BookRequest:
      type: object
      required: [doctorId, slotStartAt, reason]
      properties:
        doctorId: { type: string }
        slotStartAt: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 500 }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
